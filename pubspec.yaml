name: facturas_py
description: Registro de facturas de gastos en Paraguay con extracción por Gemini y reporte PDF mensual.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.1.2
  intl: any
  image: ^4.2.0
  google_mlkit_document_scanner: ^0.7.2
  google_mlkit_barcode_scanning: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
